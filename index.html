<html lang="en">
    <head>
        <meta charset="utf-8">
        <style>
            body {margin: 0; }
        </style>
    </head>
    <body>
        <script type="module" src="./src/frontend/frontend.js"></script>
        <dialog id="chal_desc">
        </dialog>
        <script type="module">
            import { flagchecker } from "./src/frontend/frontend.js";
          
            async function submitFlag(challengeId) {
                let name = document.getElementsByName("flag")[0];
                const inputElement = document.getElementById(challengeId);
                
                if (!inputElement) {
                  console.error("Input element not found!");
                  return;
                }
              
                const flagValue = inputElement.value;
              
                if (!flagValue) {
                  alert("Please enter a flag!");
                  return;
                }
              
                try {
                  const response = await flagchecker(name.id, name.value);
              
                  if (response && response.status === 200) {
                    console.log("let's go");
                    alert("You solved it!!");
              
                    const dialog = document.getElementById("chal_desc");
                    if (dialog) dialog.close();
                    else console.error("Dialog element not found!");
                  } else {
                    alert("Your flag is incorrect :(");
                  }
                } catch (error) {
                  console.error("Error checking flag:", error);
                  alert("Something went wrong!");
                }
              }
              
          
            window.submitFlag = submitFlag;
          </script>
          
          
    </body>
</html>
