<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login... or whatever.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: monospace;
      padding: 2rem;
    }
    input, button {
      background-color: #111;
      border: 1px solid #0f0;
      color: #0f0;
      padding: 0.5rem;
      margin: 0.5rem 0;
      font-family: monospace;
    }
    input:focus, button:hover {
      outline: none;
      border-color: #ff0;
    }
    .subtle {
      color: #888;
    }
    .terminal {
      border-left: 3px solid #0f0;
      padding-left: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <h1>🔐 Login Interface</h1>
  <p>Not sure what you expected. But here’s a box. Type stuff.</p>

  <form action="/" method="POST">
    <label>Username:</label><br>
    <input type="text" name="username" required><br>
    <label>Password (lol):</label><br>
    <input type="password" name="password" required><br>
    <button type="submit">Submit & Pray</button>
  </form>

  <div class="terminal">
    <p class="subtle">Need help? Try guessing. That’s what everyone else does.</p>
  </div>
</body>
</html>
