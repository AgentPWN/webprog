<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Report</title>
    <style>
        body {
            background-color: #121212;
            color: #0ff; /* Cyberpunk Neon */
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff00ff; /* Neon Pink */
        }
        .report-container {
            max-width: 600px;
            margin: auto;
            background-color: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #0ff;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            background-color: #333;
            color: #0ff;
            border: 1px solid #0ff;
            border-radius: 5px;
        }
        button {
            background-color: #ff00ff;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 5px;
        }
        button:hover {
            background-color: #ff1493;
        }
        .reports {
            margin-top: 20px;
            text-align: left;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .report-item {
            background-color: #333;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .report-item strong {
            color: #ff0;
        }
    </style>
</head>
<body>

<h1>🛠 Report a Bug</h1>
<p>Found a bug? Let us know and help improve the website!</p>

<div class="report-container">
    <input id="nameInput" placeholder="Your name" />
    <textarea id="messageInput" placeholder="Describe the bug..."></textarea>    
    <button onclick="report_bugs()">Submit Report</button>
</div>

<h2>📜 Reported Issues</h2>
<div class="reports" id="bug-list"></div>
<a href="/report.html" ><button>click me</button></a>
<script nonce="abcde">
    function report_bugs() {
        let name = document.getElementById('nameInput').value;
        let message = document.getElementById('messageInput').value;

        console.log("Submitting:", { name, message });

        fetch("/api/bug_report", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, message })
        })            
        .then(response => response.json())
        .then(data => {
            console.log("Data has been added to the report:", data);
            alert("Bug report submitted successfully!");
            document.getElementById('nameInput').value = '';
            document.getElementById('messageInput').value = '';
        })
        .catch(err => {
            console.error("Failed to submit bug report:", err);
            alert("Error submitting bug report.");
        });
    }
</script>
</body>
</html>
