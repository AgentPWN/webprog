<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Challenge Hub</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: monospace;
      padding: 3rem;
      line-height: 1.6;
    }
    h1, h2 {
      color: #0f0;
    }
    .section {
      margin-top: 2rem;
    }
    .link {
      color: #0ff;
      text-decoration: underline;
      cursor: pointer;
    }
    .warning {
      color: #f00;
      font-weight: bold;
    }
    .footer {
      margin-top: 5rem;
      font-size: 0.8rem;
      color: #555;
    }
    code {
      background: #111;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>// WELCOME TO THE GRID //</h1>

  <div class="section">
    <h2>📂 Accessing File: <span class="link">{{ file }}</span></h2>
    <p><span class="warning">[!] Warning:</span> Unauthorized peeking may trigger alarms. Or maybe not. Who knows. 😈</p>
    <pre><code>{{ content }}</code></pre>
  </div>
  <div class="footer">
    <p>© 2025 Challenge Corp™ — We see you. 👀</p>
  </div>
</body>
</html>
